<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VELARIS</title>
<link rel="manifest" id="pwa-manifest">
<meta name="theme-color" content="#13070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VELARIS">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#13070f;
  --surface:#1c0a17;
  --card:#221021;
  --card2:#2a142a;
  --border:#3a1a31;
  --border2:#52224a;
  --text:#f7e4ee;
  --muted:#7a5a70;
  --muted2:#9a7a90;
  --pink:#ff8fb8;
  --pink-dim:rgba(255,143,184,0.14);
  --pink-glow:rgba(255,143,184,0.35);
  --purple:#c89cf0;
  --purple-dim:rgba(200,156,240,0.14);
  --gold:#f0c987;
  --gold-dim:rgba(240,201,135,0.12);
  --star:#ffb3d1;
  --r:16px;
  --r2:10px;
}
/* ── LIGHT MODE (kept for compatibility) ── */
body.light-mode{
  --bg:#fdf8f5;--surface:#f5ede8;--card:#ffffff;--card2:#faf0ec;
  --border:#e8d5cc;--border2:#d9bfb5;--text:#2a1520;
  --muted:#9a7a85;--muted2:#7a5a65;--pink:#c9507a;
  --pink-dim:rgba(201,80,122,0.1);--pink-glow:rgba(201,80,122,0.2);
  --purple:#6b5dd8;--purple-dim:rgba(107,93,216,0.1);
  --gold:#9a7230;--gold-dim:rgba(154,114,48,0.1);
}
body{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at top,#2a0e22 0%,var(--bg) 60%);color:var(--text);min-height:100vh;padding-bottom:80px;overflow-x:hidden;scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}

/* ── AURORA (rose/blush) ── */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;filter:blur(70px);opacity:.7}
.aurora-blob{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:auroraFloat 22s ease-in-out infinite}
.aurora-blob.a1{width:460px;height:460px;background:radial-gradient(circle,rgba(255,143,184,.55),transparent 70%);top:-140px;left:-120px}
.aurora-blob.a2{width:420px;height:420px;background:radial-gradient(circle,rgba(200,156,240,.5),transparent 70%);top:28%;right:-140px;animation-delay:-7s}
.aurora-blob.a3{width:380px;height:380px;background:radial-gradient(circle,rgba(240,201,135,.38),transparent 70%);bottom:-100px;left:18%;animation-delay:-14s}
.aurora-blob.a4{width:300px;height:300px;background:radial-gradient(circle,rgba(255,99,160,.4),transparent 70%);top:55%;left:35%;animation-delay:-10s}
@keyframes auroraFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-40px) scale(1.12)}66%{transform:translate(-40px,50px) scale(.92)}}

/* ── STARFIELD / HEARTS ── */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:var(--min,.1);transform:scale(1)}50%{opacity:var(--max,.7);transform:scale(1.4)}}
.heart-float{position:fixed;pointer-events:none;z-index:1;font-size:14px;opacity:0;animation:heartRise 9s linear infinite}
@keyframes heartRise{0%{transform:translateY(20px) scale(.6) rotate(-5deg);opacity:0}10%{opacity:.55}90%{opacity:.4}100%{transform:translateY(-110vh) scale(1.1) rotate(8deg);opacity:0}}

/* ── FADE / GLOW UTILS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tab-content,#tab-today>*,#tab-history>*,#tab-messages>*,#tab-roadmap>*,#tab-future>*,#tab-settings>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
.block{transition:all .3s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(8px)}
.block:hover{border-color:var(--pink)!important;transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,143,184,.22),0 0 0 1px rgba(255,143,184,.15)}
.skill-card{transition:all .3s ease;backdrop-filter:blur(6px)}
.skill-card:hover{transform:translateY(-3px);border-color:var(--pink)!important;box-shadow:0 10px 28px rgba(255,143,184,.2)}
.ntab{transition:all .25s ease}
.ntab:hover{color:var(--pink)}
.ptab{transition:all .25s ease}

/* ── GLASS NAV (love-soft) ── */
.nav-tabs{backdrop-filter:blur(24px);background:rgba(28,10,23,.7)!important;border-top:1px solid rgba(255,143,184,.12)!important;box-shadow:0 -8px 30px rgba(255,143,184,.08)}
.header{backdrop-filter:blur(28px)!important;background:rgba(28,10,23,.72)!important;border-bottom:1px solid rgba(255,143,184,.1)!important}
.person-tabs{backdrop-filter:blur(22px);background:rgba(28,10,23,.6)!important}

/* heading polish */
h1,h2,h3,.cormorant{font-family:'Cormorant Garamond',serif;letter-spacing:.5px}
::selection{background:var(--pink-glow);color:#fff}

/* ── PIN SCREEN ── */
#pin-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);
  padding:32px 24px;
}
.pin-bg-glow{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(139,125,216,0.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.pin-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:3rem;font-weight:300;letter-spacing:0.3em;
  color:var(--text);text-align:center;margin-bottom:6px;
  position:relative;z-index:1;
}
.pin-logo span{color:var(--gold)}
.pin-sub{
  font-size:12px;color:var(--muted2);letter-spacing:0.15em;
  text-align:center;margin-bottom:40px;font-style:italic;
  position:relative;z-index:1;
}
.pin-dots{display:flex;gap:14px;margin-bottom:36px;position:relative;z-index:1}
.pin-dot{
  width:10px;height:10px;border-radius:50%;
  border:1px solid var(--border2);background:transparent;
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
.pin-dot.filled{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.pin-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;width:220px;position:relative;z-index:1;
}
.pin-btn{
  height:58px;border-radius:var(--r2);
  border:1px solid var(--border);background:var(--card);
  font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;
  color:var(--text);cursor:pointer;
  transition:all .15s ease;display:flex;align-items:center;justify-content:center;
}
.pin-btn:hover{background:var(--card2);border-color:var(--border2)}
.pin-btn:active{transform:scale(0.94);background:var(--border)}
.pin-btn.del{font-size:1rem;color:var(--muted2);font-family:'DM Sans',sans-serif}
.pin-btn.empty{border:none;background:transparent;cursor:default}
.pin-error{font-size:11px;color:#c97a7a;height:16px;text-align:center;margin-top:14px;letter-spacing:.05em;position:relative;z-index:1}
.pin-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.8;letter-spacing:.03em;position:relative;z-index:1}
@keyframes pinShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:pinShake .4s ease}

/* ── APP BODY ── */
#app{display:none;position:relative;z-index:1}

/* ── HEADER ── */
.header{
  background:rgba(8,8,16,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:18px 18px 14px;
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.velaris-name{
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem;font-weight:300;letter-spacing:.2em;color:var(--text);
}
.velaris-date{font-size:10px;color:var(--muted2);margin-top:2px;letter-spacing:.05em}
.header-right{display:flex;align-items:center;gap:8px}
.lock-btn{
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--border);background:transparent;
  color:var(--muted2);cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.lock-btn:hover{border-color:var(--border2);color:var(--text)}
.streaks-row{display:flex;gap:6px}
.streak-pill{
  padding:5px 12px;border-radius:100px;
  font-size:11px;font-weight:600;text-align:center;
  border:1px solid;
}
.streak-pill.pink{background:var(--pink-dim);border-color:rgba(201,122,170,.3);color:var(--pink)}
.streak-pill.purple{background:var(--purple-dim);border-color:rgba(139,125,216,.3);color:var(--purple)}
.streak-pill .snum{font-family:'Cormorant Garamond',serif;font-size:1.1rem;display:block;line-height:1.1}
.both-prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog-lbl{font-size:10px;color:var(--muted2);margin-bottom:3px;letter-spacing:.03em}
.prog-track{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill-p{height:100%;background:var(--pink);border-radius:2px;transition:width .5s ease}
.prog-fill-s{height:100%;background:var(--purple);border-radius:2px;transition:width .5s ease}
.prog-pct{font-size:10px;margin-top:3px;font-weight:500}
.pct-p{color:var(--pink)}.pct-s{color:var(--purple)}

/* ── PERSON TABS ── */
.person-tabs{
  display:grid;grid-template-columns:1fr 1fr;
  background:rgba(8,8,16,0.9);
  border-bottom:1px solid var(--border);
  padding:6px 14px;gap:6px;
}
.ptab{
  padding:8px;border-radius:100px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--muted2);
  text-align:center;transition:all .2s;
  border:1px solid transparent;letter-spacing:.05em;
  background:none;font-family:'DM Sans',sans-serif;
}
.ptab.ap{background:var(--pink-dim);color:var(--pink);border-color:rgba(201,122,170,.2)}
.ptab.as{background:var(--purple-dim);color:var(--purple);border-color:rgba(139,125,216,.2)}

/* ── NAV TABS ── */
.nav-tabs{
  display:flex;background:rgba(8,8,16,.9);
  border-bottom:1px solid var(--border);
  padding:0 10px;overflow-x:auto;
  scrollbar-width:none;
}
.nav-tabs::-webkit-scrollbar{display:none}
.ntab{
  padding:9px 12px;font-size:10px;font-weight:600;
  color:var(--muted);cursor:pointer;border-bottom:1px solid transparent;
  transition:all .2s;background:none;
  border-top:none;border-left:none;border-right:none;
  font-family:'DM Sans',sans-serif;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.ntab.ap{color:var(--pink);border-bottom-color:var(--pink)}
.ntab.as{color:var(--purple);border-bottom-color:var(--purple)}

/* ── MOTTO ── */
.motto{
  padding:10px 18px;font-size:11px;font-style:italic;
  text-align:center;border-bottom:1px solid var(--border);
  letter-spacing:.03em;line-height:1.6;
}
.motto.mp{background:var(--pink-dim);color:var(--pink)}
.motto.ms{background:var(--purple-dim);color:var(--purple)}

/* ── MAIN ── */
.main{padding:14px 16px;max-width:600px;margin:0 auto}
.tab-content{display:none}

/* ── SECTION LABEL ── */
.sec-lbl{
  font-size:8px;font-weight:700;letter-spacing:.25em;
  text-transform:uppercase;color:var(--muted);
  margin:18px 0 8px;display:flex;align-items:center;gap:8px;
}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── TASK BLOCKS ── */
.block{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);margin-bottom:6px;cursor:pointer;
  transition:border-color .2s,opacity .2s;overflow:hidden;
}
.block:hover{border-color:var(--border2)}
.block.done{opacity:.5;border-color:var(--border)}
.block-inner{display:flex;align-items:center;gap:10px;padding:11px 13px}
.bcheck{
  width:18px;height:18px;border-radius:50%;
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;font-size:9px;color:white;
}
.bcheck.cp{background:var(--pink);border-color:var(--pink)}
.bcheck.cs{background:var(--purple);border-color:var(--purple)}
.baccent{width:2px;height:28px;border-radius:2px;flex-shrink:0}
.binfo{flex:1;min-width:0}
.btime{font-size:9px;color:var(--muted);margin-bottom:1px;letter-spacing:.03em}
.btitle{font-size:12px;font-weight:500;color:var(--text);line-height:1.3}
.block.done .btitle{text-decoration:line-through;color:var(--muted)}
.btag{
  font-size:8px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:100px;flex-shrink:0;
}

/* ── SKILL CARDS ── */
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.skill-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:10px;text-align:center;
}
.skill-icon{font-size:14px;margin-bottom:2px}
.skill-name{font-size:8px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.skill-streak{
  font-family:'Cormorant Garamond',serif;
  font-size:1.8rem;font-weight:300;line-height:1;
}
.skill-days{font-size:8px;color:var(--muted)}

/* ── NOTE CARD ── */
.note-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:13px;margin-bottom:8px;
}
.note-lbl{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.note-ta{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:12px;resize:none;
  outline:none;min-height:50px;transition:border-color .2s;
}
.note-ta:focus{border-color:var(--border2)}
.note-ta::placeholder{color:var(--muted)}
.btn-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.save-btn{
  padding:7px 16px;border-radius:6px;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;
  transition:opacity .2s;letter-spacing:.05em;
}
.save-btn.p{background:var(--pink);color:#0a0415}
.save-btn.s{background:var(--purple);color:#0a0415}
.save-btn:hover{opacity:.85}
.ghost-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);padding:7px 13px;border-radius:6px;
  font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;
  transition:all .2s;
}
.ghost-btn:hover{border-color:var(--border2);color:var(--text)}

/* ── PARTNER TAB ── */
.partner-task{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.partner-task:last-child{border-bottom:none}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ptext{font-size:12px;color:var(--text)}
.ptext.done{text-decoration:line-through;color:var(--muted)}
.partner-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:12px;margin-bottom:8px;
}
.note-display{font-size:12px;color:var(--muted2);font-style:italic;line-height:1.7;min-height:30px}

/* ── MESSAGES ── */
.msg-bubble{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:11px 13px;margin-bottom:7px;
}
.msg-meta{font-size:9px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.msg-from-p{color:var(--pink);font-weight:700}
.msg-from-s{color:var(--purple);font-weight:700}
.msg-text{font-size:12px;color:var(--text);line-height:1.7}

/* ── WHY TAB ── */
.why-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:10px;
}
.why-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.4rem;font-weight:300;color:var(--gold);
  margin-bottom:16px;text-align:center;letter-spacing:.05em;
}
.why-p{font-size:12.5px;color:var(--muted2);line-height:2;margin-bottom:12px}
.why-p:last-child{margin-bottom:0}
.why-sign{color:var(--pink);font-style:italic;font-size:13px}

/* ── ROADMAP ── */
.roadmap-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;margin-bottom:8px;
}
.roadmap-step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.roadmap-step:last-child{border-bottom:none}
.rnum{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px;
}
.rtitle{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.rdesc{font-size:11px;color:var(--muted2);line-height:1.6}

/* ── OPEN WHEN ── */
.open-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.open-btn{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:11px;font-size:11px;
  color:var(--muted2);cursor:pointer;transition:all .2s;
  font-family:'DM Sans',sans-serif;font-weight:500;
}
.open-btn:hover{background:var(--card2);border-color:var(--border2);color:var(--text)}
.letter-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:18px 16px;
  font-size:12.5px;color:var(--muted2);
  font-style:italic;line-height:2.2;min-height:120px;
  transition:opacity .2s;white-space:pre-line;
  font-family:'Cormorant Garamond',serif;font-weight:300;
}

/* ── FUTURE LETTERS ── */
.fl-compose{
  background:var(--card);border:1px dashed var(--border2);
  border-radius:var(--r2);padding:14px;margin-bottom:10px;
}
.fl-date-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fl-date-lbl{font-size:10px;color:var(--muted);flex-shrink:0;letter-spacing:.05em}
.fl-date-input{
  border:1px solid var(--border);border-radius:6px;
  padding:5px 10px;font-size:11px;color:var(--text);
  font-family:'DM Sans',sans-serif;background:var(--bg);outline:none;flex:1;
}
.fl-card{border-radius:var(--r2);padding:13px;margin-bottom:7px;position:relative;overflow:hidden}
.fl-card.locked{background:var(--card);border:1px solid var(--border)}
.fl-card.unlocked{background:rgba(196,169,106,0.05);border:1px solid rgba(196,169,106,.2)}
.fl-lock-icon{font-size:15px;margin-bottom:4px}
.fl-card-date{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.fl-card-date.p{color:var(--pink)}.fl-card-date.s{color:var(--purple)}.fl-card-date.g{color:var(--gold)}
.fl-preview{font-size:12px;color:var(--text);line-height:1.7;font-style:italic;font-family:'Cormorant Garamond',serif}
.fl-locked-text{font-size:11px;color:var(--muted);font-style:italic}
.fl-del{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:13px;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:4px}
.fl-del:hover{color:#c97a7a}
.fl-empty{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-style:italic}

/* ── HISTORY ── */
.hist-row{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);padding:11px 13px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.hist-date{font-size:12px;font-weight:500;color:var(--text)}
.hist-bar-wrap{display:flex;align-items:center;gap:8px}
.hist-bar-bg{width:80px;height:3px;background:var(--border);border-radius:3px;overflow:hidden}

/* ── ROUGH DAY ── */

}
.soft-btn:hover{background:rgba(139,125,216,.2)}
.night-btn{

}
.cd-label{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

.cd-sub{font-size:9px;color:var(--muted2);margin-top:1px}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:22px;left:50%;

  padding:9px 20px;border-radius:100px;
  font-size:12px;font-weight:600;
  transition:transform .3s ease;z-index:9998;white-space:nowrap;
  letter-spacing:.05em;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.tp{background:var(--pink);color:#0a0415}
.toast.ts{background:var(--purple);color:#0a0415}

/* ── EXPORT ── */
.export-btn{

}

}

/* ═══ PREMIUM POLISH LAYER (additive) ═══ */
*,*::before,*::after{transition-timing-function:cubic-bezier(.22,.61,.36,1)}
.aurora-blob{animation-duration:32s!important;will-change:transform,opacity}
.aurora{animation:auroraBreathe 9s ease-in-out infinite}
@keyframes auroraBreathe{0%,100%{opacity:.7;filter:blur(70px)}50%{opacity:.92;filter:blur(80px)}}
/* particles */
#particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,170,200,.7);box-shadow:0 0 8px rgba(255,143,184,.8);animation:floatUp linear infinite;will-change:transform,opacity}
@keyframes floatUp{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}90%{opacity:.6}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
/* card glow shimmer */
.skill-card,.block,.note-card,.fl-card,.msg-card,.roadmap-card,.settings-card,.why-card,.task-card{position:relative;will-change:transform}
.skill-card::after,.block::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),rgba(255,143,184,.10),transparent 40%);opacity:0;transition:opacity .4s;pointer-events:none}
.skill-card:hover::after,.block:hover::after{opacity:1}
.skill-card:hover,.block:hover{transform:translateY(-3px) scale(1.012)}
/* button press */
button,.btn,.ntab,.ptab{transition:transform .15s cubic-bezier(.22,.61,.36,1),box-shadow .25s,color .25s,background .25s,border-color .25s}
button:active,.btn:active,.ntab:active,.ptab:active{transform:scale(.96)}
/* smoother tab fade */
.tab-content,#tab-today>*,#tab-history>*,#tab-messages>*,#tab-roadmap>*,#tab-future>*,#tab-settings>*{animation:fadeBlur .55s cubic-bezier(.22,.61,.36,1) both!important}
@keyframes fadeBlur{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
/* progress bar shimmer */
.prog-bar,[class*="progress"] > div, .pct-bar{position:relative;overflow:hidden}
.prog-bar::after,.pct-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-100%);animation:shimmer 2.6s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
/* motivational ticker */
.affirm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:60;
  padding:8px 16px;border-radius:999px;font-size:11px;letter-spacing:.06em;font-style:italic;
  background:rgba(28,10,23,.65);backdrop-filter:blur(18px);
  border:1px solid rgba(255,143,184,.22);color:#f6d6e4;
  box-shadow:0 8px 28px rgba(255,99,160,.18);
  opacity:0;transition:opacity .8s;pointer-events:none;max-width:90vw;text-align:center}
.affirm.show{opacity:1}
/* ambient toggles */
.amb-dock{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:8px}
.amb-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,143,184,.25);
  background:rgba(28,10,23,.6);backdrop-filter:blur(14px);color:#f0c987;font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35);transition:all .25s}
.amb-btn:hover{transform:scale(1.08);border-color:var(--pink);color:var(--pink)}
.amb-btn.on{background:linear-gradient(135deg,rgba(255,143,184,.35),rgba(200,156,240,.3));color:#fff;border-color:rgba(255,143,184,.6)}
body.ambient-glow{filter:saturate(1.1) brightness(1.04)}
body.ambient-glow .aurora{opacity:1!important}
/* mobile polish */
@media (max-width:720px){
  body{padding-bottom:110px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

    position:fixed!important;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    border-radius:22px!important;border:1px solid rgba(255,143,184,.25)!important;
    box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 24px rgba(255,143,184,.12)!important;

  }

  .ntab.ap,.ntab.as{background:linear-gradient(135deg,rgba(255,143,184,.22),rgba(200,156,240,.18));border-bottom:none!important}
  .affirm{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
  .skills-grid{grid-template-columns:repeat(2,1fr)!important}
  .amb-dock{right:8px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:none;flex-direction:row}
  button,.btn,.ntab{min-height:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ═══ VELARIS IDENTITY — cinematic brand layer ═══ */
.velaris-name,.pin-logo{
  background:linear-gradient(92deg,#fff 0%,#ffd5e6 28%,#f0c987 55%,#ffd5e6 82%,#fff 100%);

}
@keyframes velarisShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* Signature corner glyphs */
#app::before,#app::after{

/* Luxurious cards */

}

/* Header refinement */
.header{background:linear-gradient(180deg,rgba(20,8,18,.92),rgba(12,5,12,.78))!important;border-bottom-color:rgba(255,143,184,.08)!important;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.streak-pill{box-shadow:0 4px 14px rgba(255,143,184,.12),inset 0 0 0 1px rgba(255,255,255,.04)}

/* Premium task completion */
.block.done{

}
.bcheck.cp,.bcheck.cs{box-shadow:0 0 0 4px rgba(255,143,184,.18),0 0 18px rgba(255,143,184,.45)}
@keyframes completePulse{
  0%{box-shadow:0 0 0 0 rgba(255,143,184,.55)}
  60%{box-shadow:0 0 0 14px rgba(255,143,184,0),0 0 30px rgba(255,143,184,.5)}

}
.block.just-done{animation:completePulse .9s ease-out}

/* Completion burst */
.burst{position:fixed;pointer-events:none;z-index:999;width:0;height:0}
.burst span{
  position:absolute;left:0;top:0;font-size:14px;
  color:#ffd5e6;text-shadow:0 0 10px rgba(255,143,184,.9);

}
@keyframes burstFly{
  0%{transform:translate(0,0) scale(.4);opacity:0}
  20%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}
}

/* Refined nav + motto */
.ntab{letter-spacing:.14em!important}

.motto{font-family:'Cormorant Garamond',serif!important;font-style:italic;font-size:13px!important;letter-spacing:.04em!important;background:transparent!important;border-bottom-color:rgba(255,143,184,.07)!important;padding:14px 18px!important}

}

input:checked+.toggle-track{background:var(--pink)}

<body>

// ── PRIVATE NOTE ENCRYPTION (AES-GCM, key derived from PIN) ──
let _encKey = null;
async function deriveKey(pin) {
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: new TextEncoder().encode('velaris_private'), iterations:100000, hash:'SHA-256' },
    raw, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptNote(text) {
  if(!_encKey) return text;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = await crypto.subtle.encrypt({name:'AES-GCM',iv}, _encKey, new TextEncoder().encode(text));
  return btoa(String.fromCharCode(...iv) + String.fromCharCode(...new Uint8Array(enc)));
}
async function decryptNote(b64) {
  if(!_encKey || !b64) return b64||'';
  try {
    const raw = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    const iv = raw.slice(0,12), data = raw.slice(12);
    const dec = await crypto.subtle.decrypt({name:'AES-GCM',iv}, _encKey, data);
    return new TextDecoder().decode(dec);
  } catch(e) { return '🔒 (encrypted)'; }
}

// ── ANNIVERSARY ──
const ANNIV_DATE = new Date('2019-11-06');
const daysTogther = Math.floor((new Date() - ANNIV_DATE) / 86400000);
function getTogetherDuration() {
  const start = new Date('2019-11-06');
  const now = new Date();
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  let days = now.getDate() - start.getDate();
  if (days < 0) {
    months--;
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if (months < 0) { years--; months += 12; }
  let parts = [];
  if (years > 0) parts.push(`${years} year${years !== 1 ? 's' : ''}`);
  if (months > 0) parts.push(`${months} month${months !== 1 ? 's' : ''}`);
  if (days > 0) parts.push(`${days} day${days !== 1 ? 's' : ''}`);
  return parts.join(', ');
}
const togetherDuration = getTogetherDuration();

// ── REALTIME SYNC via Supabase WebSocket ──
function startRealtimeSync() {
  const wsUrl = `wss://realtime.supabase.co/socket/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`;
  let ws, heartbeat;
  function connect() {
    try { ws = new WebSocket(wsUrl); } catch(e) { startAutoSync(); return; }
    ws.onopen = () => {
      ws.send(JSON.stringify({
        topic: `realtime:public:couple_data:key=eq.${DB_KEY}`,
        event: 'phx_join', payload: {}, ref: '1'
      }));
      heartbeat = setInterval(() => {
        if(ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'}));
      }, 25000);
    };
    ws.onmessage = async (e) => {
      try {
        const msg = JSON.parse(e.data);
        if(msg.event === 'INSERT' || msg.event === 'UPDATE') {
          const fresh = await sbGet(DB_KEY);
          if(fresh) {
            const parsed = typeof fresh==='string'?JSON.parse(fresh):fresh;
            if(JSON.stringify(parsed) !== JSON.stringify(state)) {
              state = parsed;
              ensureState();
              render();
              renderLastSeen();
              showToast('✦ Synced live','ts');
            }
          }
        }
      } catch(e) {}
    };
    ws.onclose = () => { clearInterval(heartbeat); setTimeout(connect, 5000); };
    ws.onerror = () => ws.close();
  }
  connect();
  startAutoSync(); // 30s polling as fallback
}

// ── PIN (with SHA-256 hashing) ──
let pinBuf = '';
async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('velaris_salt_' + pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function pinPress(d) {
  if (pinBuf.length >= 4) return;
  pinBuf += d; updateDots();
  if (pinBuf.length === 4) setTimeout(checkPin, 130);
}
function pinDel() { pinBuf = pinBuf.slice(0,-1); updateDots(); document.getElementById('pin-error').textContent = ''; }
function updateDots() {
  for (let i = 0; i < 4; i++)
    document.getElementById('pd'+i).className = 'pin-dot' + (i < pinBuf.length ? ' filled' : '');
}
async function checkPin() {
  const hashed = await hashPin(pinBuf);
  const stored = await sbGet(PIN_KEY);
  if (!stored) {
    await sbSet(PIN_KEY, hashed);
    _encKey = await deriveKey(pinBuf);
    unlock(); return;
  }
  // support both hashed (new) and plain (legacy) PINs
  if (hashed === stored || pinBuf === stored) {
    _encKey = await deriveKey(pinBuf);
    // upgrade plain PIN to hashed silently
    if (pinBuf === stored) sbSet(PIN_KEY, hashed);
    unlock();
  } else {
    document.getElementById('pin-error').textContent = 'wrong PIN, try again ✦';
    document.getElementById('pin-dots').classList.add('shake');
    setTimeout(() => document.getElementById('pin-dots').classList.remove('shake'), 400);
    pinBuf = ''; updateDots();
  }
}
function lockApp() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('pin-screen').style.display = 'flex';
  pinBuf = ''; updateDots(); document.getElementById('pin-error').textContent = '';
}
function unlock() {

  document.getElementById('app').style.display = 'block';

}

function calcStreak(who){
  const days=Object.keys(state[who].streakDays).sort().reverse();
  if(!days.length)return 0;
  let s=0,c=new Date(TODAY);
  for(const d of days){
    const dd=new Date(d),diff=Math.round((c-dd)/86400000);
    if(diff===0||diff===1){s++;c=dd;}else break;
  }
  return s;
}

  let s=0,c=new Date(TODAY);
  for(const d of days){
    const dd=new Date(d),diff=Math.round((c-dd)/86400000);
    if(diff===0||diff===1){s++;c=dd;}else break;
  }
  return s;
}

function velarisBurst(x,y){
  const b=document.createElement('div');b.className='burst';b.style.left=x+'px';b.style.top=y+'px';
  const glyphs=['✦','♡','✧','❀','✿','♥'];
  for(let i=0;i<10;i++){
    const s=document.createElement('span');
    s.textContent=glyphs[i%glyphs.length];
    const a=(Math.PI*2*i)/10+Math.random()*.5;
    const d=50+Math.random()*40;
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.setProperty('--rot',(Math.random()*360)+'deg');
    s.style.color=Math.random()>.5?'#ffd5e6':'#f0c987';
    b.appendChild(s);
  }
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),1000);
}
function toggleTask(id,skill){
  const p=activePerson;
  if(!state[p].checked[TODAY])state[p].checked[TODAY]={};
  const was=state[p].checked[TODAY][id];
  state[p].checked[TODAY][id]=!was;
  if(!was){
    if(skill){
      if(!state[p].skillDays[skill])state[p].skillDays[skill]=[];
      if(!state[p].skillDays[skill].includes(TODAY))state[p].skillDays[skill].push(TODAY);
    }
    state[p].streakDays[TODAY]=true;
    const ev=window.event;
    if(ev){const r=(ev.currentTarget||ev.target).getBoundingClientRect();velarisBurst(r.left+r.width/2,r.top+r.height/2);}
    showToast(activePerson==='sanjana'?'🩷 Done':'💜 Done',activePerson==='sanjana'?'tp':'ts');
  }
  setS(state).then(()=>{
    render();
    // re-pulse the just-completed task
    requestAnimationFrame(()=>{
      document.querySelectorAll('.block').forEach(el=>{
        if(el.dataset.tid===id&&!was){el.classList.add('just-done');setTimeout(()=>el.classList.remove('just-done'),900);}
      });
    });
  });
}

    const done=dayTasks.filter(t=>ch[t.id]).length;

    const d=new Date(dStr+'T00:00:00');
    const lbl2=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
    const color=pct>=80?'#34d399':pct>=50?'#facc15':'#f87171';
    const row=document.createElement('div');row.className='hist-row';
    row.innerHTML=`<div class="hist-date">${lbl2}</div><div class="hist-bar-wrap"><div class="hist-bar-bg"><div class="hist-bar-fill" style="width:${pct}%;background:${isPink?'var(--pink)':'var(--purple)'}"></div></div><div class="hist-pct" style="color:${color}">${pct}%</div></div>`;

function savePrivateNote(){
  const val=document.getElementById('private-note-input').value;

function sendMsg(){

function renderFuture(){

  const compose=document.createElement('div');compose.className='fl-compose';
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const def=new Date();def.setMonth(def.getMonth()+3);
  compose.innerHTML=`
    <div class="note-lbl">✍ Write a letter to the future</div>
    <textarea class="note-ta" id="fl-text" rows="4" placeholder="Dear future me... / Dear Sanjay, by the time you read this... / I hope by this date you have..."></textarea>
    <div class="fl-date-row">
      <div class="fl-date-lbl">Open on:</div>
      <input type="date" class="fl-date-input" id="fl-date" min="${tomorrow.toISOString().split('T')[0]}" value="${def.toISOString().split('T')[0]}">
    </div>
    <div class="btn-row"><button class="save-btn ${isPink?'p':'s'}" onclick="saveLetter()">Seal & Lock 🔒</button></div>`;
  c.appendChild(compose);
  const myLetters=(state.futureLetters||[]).filter(l=>l.from===p).sort((a,b)=>new Date(a.openDate)-new Date(b.openDate));
  if(!myLetters.length){c.innerHTML+='<div class="fl-empty">No letters yet ✦<br>Write your first one — seal it, and open it on a special day.</div>';return;}
  myLetters.forEach(letter=>{
    const canOpen=TODAY>=letter.openDate;
    const card=document.createElement('div');
    card.className='fl-card '+(canOpen?'unlocked':'locked');
    const openD=new Date(letter.openDate+'T00:00:00');
    const dateStr=openD.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
    if(canOpen){
      card.innerHTML=`<div class="fl-lock-icon">💌</div><div class="fl-card-date g">Opened — ${dateStr}</div><div class="fl-preview">${letter.text.replace(/\n/g,'<br>')}</div><button class="fl-del" onclick="deleteLetter('${letter.id}')">🗑</button>`;
    }else{
      const daysLeft=Math.ceil((new Date(letter.openDate)-new Date(TODAY))/86400000);
      card.innerHTML=`<div class="fl-lock-icon">🔒</div><div class="fl-card-date ${isPink?'p':'s'}">Opens ${dateStr} · ${daysLeft} day${daysLeft===1?'':'s'} away</div><div class="fl-locked-text">This letter is sealed. Come back on ${dateStr} to read it ✦</div><button class="fl-del" onclick="deleteLetter('${letter.id}')">🗑</button>`;
    }
    c.appendChild(card);
  });

function saveLetter(){
  const text=document.getElementById('fl-text').value.trim();
  const date=document.getElementById('fl-date').value;
  if(!text){showToast('Write something first ✦',activePerson==='sanjana'?'tp':'ts');return;}
  if(!date){showToast('Pick a date 📅',activePerson==='sanjana'?'tp':'ts');return;}
  if(!state.futureLetters)state.futureLetters=[];
  state.futureLetters.push({id:Date.now().toString(),from:activePerson,text,openDate:date,createdOn:TODAY});
  setS(state).then(()=>{renderFuture();showToast('Sealed with love 🔒',activePerson==='sanjana'?'tp':'ts');});
}
function deleteLetter(id){
  if(!confirm('Delete this letter?'))return;
  state.futureLetters=(state.futureLetters||[]).filter(l=>l.id!==id);
  setS(state).then(()=>renderFuture());
}

// ── EXCEL EXPORT ──
function exportExcel(){
  const wb=XLSX.utils.book_new();
  ['sanjana','sanjay'].forEach(who=>{
    const tasks=who==='sanjana'?SANJANA_TASKS:SANJAY_TASKS;
    const header=['Date',...tasks.map(t=>t.name),'Done','%','Note'];
    const rows=[header];
    const allDays=Object.keys(state[who].checked).sort();
    allDays.forEach(dStr=>{
      const ch=state[who].checked[dStr]||{};
      const dayTasks=tasks.filter(t=>!t.weekendOnly||[0,6].includes(new Date(dStr+'T00:00:00').getDay()));
      const done=dayTasks.filter(t=>ch[t.id]).length;
      const pct=Math.round(done/dayTasks.length*100);
      const note=state[who].note[dStr]||'';
      rows.push([dStr,...tasks.map(t=>ch[t.id]?'✓':''),done,pct+'%',note]);
    });
    if(rows.length>1){
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:12},...tasks.map(()=>({wch:20})),{wch:6},{wch:6},{wch:40}];
      XLSX.utils.book_append_sheet(wb,ws,who==='sanjana'?'Sanjana':'Sanjay');
    }
  });
  // messages sheet
  if(state.messages&&state.messages.length){
    const mrows=[['From','Date','Time','Message'],...state.messages.map(m=>[m.from,m.date,m.time,m.text])];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(mrows),'Messages');
  }
  XLSX.writeFile(wb,`VELARIS_${TODAY}.xlsx`);
  showToast('↓ Downloaded ✦','tp');
}

}
